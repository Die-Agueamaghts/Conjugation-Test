<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Französisch Konjugations-Trainer</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .verb-input {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.97rem;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }
      .verb-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25);
        background-color: rgba(52, 152, 219, 0.05);
      }
      .verb-input.active-focus {
        border-color: #2980b9;
        box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.28);
        background-color: rgba(41, 128, 185, 0.06);
      }
      .verb-input.correct {
        border-color: #2ecc71;
        background-color: rgba(46, 204, 113, 0.1);
        color: #27ae60;
      }
      .verb-input.wrong {
        border-color: #e74c3c;
        background-color: rgba(231, 76, 60, 0.1);
        color: #c0392b;
      }
      .verb-form {
        position: relative;
        min-width: 0;
      }
      .solution-hint {
        margin-top: 6px;
        font-size: 0.72rem;
        color: #1e7f3e;
        font-weight: 700;
        line-height: 1.2;
        background: rgba(39, 174, 96, 0.08);
        border-left: 3px solid #27ae60;
        padding: 4px 7px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(39, 174, 96, 0.06);
        word-break: break-word;
      }
      .solution-hint.wrong {
        color: #a7261a;
        background: rgba(231, 76, 60, 0.08);
        border-left-color: #c0392b;
        box-shadow: inset 0 0 0 1px rgba(192, 57, 43, 0.06);
      }
      .trainer-controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        margin-bottom: 30px;
      }
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          box-shadow 0.2s,
          transform 0.1s ease;
      }
      .btn:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.28);
        transform: translateY(-1px);
      }
      .btn-check {
        background: #2ecc71;
        color: white;
      }
      .btn-check:hover {
        background: #28b86a;
      }
      .btn-solve {
        background: #3498db;
        color: white;
      }
      .btn-solve:hover {
        background: #2980b9;
      }
      .btn-reset {
        background: #95a5a6;
        color: white;
      }
      .btn-reset:hover {
        background: #7f8c8d;
      }
      .btn-next {
        background: #9b59b6;
        color: white;
      }
      .btn-next:hover {
        background: #8e44ad;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="verb-heading">
        <h1 id="verb-title">Französisch Konjugations-Trainer</h1>
        <div
          id="translation-icons"
          class="translation-icons"
          aria-label="Übersetzungen"
        ></div>
      </div>
    </header>

    <div class="toolbar">
      <label for="verb-select">Verb trainieren:</label>
      <select id="verb-select" aria-label="Verb auswählen"></select>
    </div>

    <div class="quickstart" aria-label="Modus-Auswahl">
      <label class="mode-label mode-alle"
        ><input type="checkbox" data-mode="alle" checked /> Alle</label
      >
      <label class="mode-label mode-indicatif"
        ><input type="checkbox" data-mode="Indicatif" /> Indicatif</label
      >
      <label class="mode-label mode-subjonctif"
        ><input type="checkbox" data-mode="Subjonctif" /> Subjonctif</label
      >
      <label class="mode-label mode-conditionnel"
        ><input type="checkbox" data-mode="Conditionnel" /> Conditionnel</label
      >
      <label class="mode-label mode-imperatif"
        ><input type="checkbox" data-mode="Impératif" /> Impératif</label
      >
      <label class="mode-label mode-participe"
        ><input type="checkbox" data-mode="Participe" /> Participe</label
      >
    </div>
    <div
      class="subbuttons"
      id="tense-buttons"
      aria-label="Zeitform-Auswahl"
    ></div>

    <div id="error-msg"></div>

    <div class="info-row">
      <div class="info-card">
        <strong>Infinitif</strong>
        <div id="verb-infinitiv">–</div>
      </div>
      <div class="info-card">
        <strong>Auxiliaire</strong>
        <div id="verb-auxiliaire">–</div>
      </div>
      <div class="info-card">
        <strong>Groupe</strong>
        <div id="verb-groupe">–</div>
      </div>
    </div>

    <div class="trainer-controls">
      <button id="btn-check" class="btn btn-check">Überprüfen</button>
      <button id="btn-solve" class="btn btn-solve">Lösung anzeigen</button>
      <button id="btn-reset" class="btn btn-reset">Zurücksetzen</button>
      <button id="btn-next-verb" class="btn btn-next">Nächstes Verb</button>
    </div>

    <div class="grid" id="conjugation-grid"></div>

    <div class="trainer-controls">
      <button id="btn-check-bottom" class="btn btn-check">Überprüfen</button>
      <button id="btn-solve-bottom" class="btn btn-solve">
        Lösung anzeigen
      </button>
      <button id="btn-reset-bottom" class="btn btn-reset">Zurücksetzen</button>
      <button id="btn-next-verb-bottom" class="btn btn-next">
        Nächstes Verb
      </button>
    </div>

    <button id="go-to-top-btn" class="go-to-top">↑ Nach oben</button>

    <script src="./js/verbs.js"></script>
    <script src="./js/translations.js"></script>
    <script src="./js/test.js"></script>
  </body>
</html>
